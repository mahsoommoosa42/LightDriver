name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup update stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build desktop and service
        run: cargo build --workspace --release --locked
      - name: Package portable app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/LightDriver/docs -Force
          Copy-Item target/release/lightdriver-desktop.exe,target/release/lightdriver-service.exe,LightDriver.cmd,README.md dist/LightDriver/
          Copy-Item docs/* dist/LightDriver/docs/
      - uses: actions/upload-artifact@v7
        with:
          name: LightDriver-Windows-x64
          path: dist/LightDriver/
          if-no-files-found: error
