[workspace]
resolver = "2"
members = ["crates/core", "crates/ipc", "crates/devices", "crates/service", "crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
lightdriver-core = { path = "crates/core" }
lightdriver-ipc = { path = "crates/ipc" }
lightdriver-devices = { path = "crates/devices" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "signal"] }
interprocess = { version = "2.4.4", features = ["tokio"] }
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "canvas", "tokio"] }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = true
