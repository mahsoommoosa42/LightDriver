[package]
name = "lightdriver-hardware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lightdriver-core.workspace = true
serde.workspace = true
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.33.1", default-features = false, features = ["system"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming"] }
